<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

    <link rel="stylesheet" href="login.css">

<body>

    <header class="navbar-background">
        <div class="nav-background">
                <div class="navbar">

                    <img src="image.png"  class="img2"> 
                    <pre><div class="text">Trading Bull</div> </pre>

                    <div>
                      <a class="a1" href="signup.html">Sign Up</a> 
                    </div>
                </div>
        </div>

<main>

                      
<div id="loginuser" class="hidden">
            <h2>Log In</h2><br><br>

            <div class="input-group">
                <label>Email</label>
                <input type="Email" placeholder="abc@gmail.com" id="Email">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="e.g. At least 8 characters" id="password">
            </div>
            
            <button onclick="login()">Log In</button>

            <div class="forgot">
               <button onclick="forgotemailid()" class="forgot-btn" >Forgot Email ID?</button>
               <button onclick="forgotpassword()" class="forgot-btn" >Forgot Password?</button>
               
            </div>

            <p class="login-link">
                Don't have an account?  <a href="signup.html">Sign up</a>
            </p>
</div>
